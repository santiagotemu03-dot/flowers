<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feliz Día de las Flores Amarillas, Tatiana 🌻</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Caveat:wght@600;700&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#FFE1B0;
    --sky-mid:#FFC773;
    --sky-low:#FF9E6D;
    --sky-horizon:#F97A6B;
    --glow:#FFF3D6;
    --hill-far:#B5654A;
    --hill-near:#8A4636;
    --flower:#FFD447;
    --flower-2:#FFB627;
    --card:#FFF8EC;
    --ink:#6B3A2B;
    --rose:#E8637B;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{ height:100%; overflow:hidden; font-family:'Quicksand', sans-serif; }
  #stage{
    position:relative;
    width:100%;
    height:100vh; height:100dvh;
    padding-top: env(safe-area-inset-top,0px);
    padding-bottom: env(safe-area-inset-bottom,0px);
    overflow:hidden;
    background: linear-gradient(180deg,
      var(--sky-top) 0%,
      var(--sky-mid) 38%,
      var(--sky-low) 66%,
      var(--sky-horizon) 100%);
    background-size: 100% 220%;
    animation: skyDrift 18s ease-in-out infinite alternate;
  }
  @keyframes skyDrift{ from{background-position:0 0;} to{background-position:0 32%;} }

  /* soft glow sun */
  #glow{
    position:absolute; left:50%; top:14%;
    width: clamp(160px,42vw,320px); height: clamp(160px,42vw,320px);
    transform: translate(-50%,-50%);
    background: radial-gradient(circle, var(--glow) 0%, rgba(255,214,150,0.35) 45%, transparent 72%);
    filter: blur(2px);
    animation: pulseGlow 6s ease-in-out infinite;
    z-index:1;
  }
  @keyframes pulseGlow{ 0%,100%{opacity:.85; transform:translate(-50%,-50%) scale(1);} 50%{opacity:1; transform:translate(-50%,-50%) scale(1.08);} }

  /* sparkles */
  .spark{
    position:absolute; color:#FFF3D6; font-size:10px; z-index:2;
    animation-name: twinkle; animation-timing-function: ease-in-out; animation-iteration-count: infinite;
  }
  @keyframes twinkle{ 0%,100%{opacity:0; transform:scale(0.4);} 50%{opacity:1; transform:scale(1);} }

  /* hills */
  #hillFar{
    position:absolute; bottom:-6%; left:-15%; width:130%; height:30%;
    background: var(--hill-far); opacity:0.55;
    border-radius: 50% 50% 0 0 / 100% 100% 0 0;
    z-index:3;
  }
  #hillNear{
    position:absolute; bottom:-8%; left:-18%; width:136%; height:22%;
    background: var(--hill-near);
    border-radius: 50% 50% 0 0 / 100% 100% 0 0;
    z-index:5;
  }

  /* swaying flowers on the hill */
  .flower{
    position:absolute; bottom:4%; font-size:24px; transform-origin:bottom center;
    z-index:6; animation: swayFlower 3.4s ease-in-out infinite;
    filter: drop-shadow(0 2px 3px rgba(107,58,43,0.3));
  }
  @keyframes swayFlower{ 0%,100%{transform:rotate(-7deg);} 50%{transform:rotate(7deg);} }

  /* drifting flowers + petals, foreground */
  .falling{
    position:absolute; top:-60px; font-size:20px; z-index:8; user-select:none;
    animation-name: fall, sway; animation-timing-function: linear, ease-in-out;
    animation-iteration-count: infinite, infinite;
    filter: drop-shadow(0 2px 2px rgba(107,58,43,0.25));
  }
  @keyframes fall{ from{transform:translateY(-10vh) rotate(0deg);} to{transform:translateY(115vh) rotate(360deg);} }
  @keyframes sway{ 0%,100%{margin-left:-18px;} 50%{margin-left:18px;} }

  /* floating hearts, gentle rise */
  .heart{
    position:absolute; bottom:-30px; font-size:16px; z-index:7; opacity:0;
    animation-name: riseHeart, driftX; animation-timing-function: ease-in, ease-in-out;
    animation-iteration-count: infinite, infinite;
  }
  @keyframes riseHeart{
    0%{ transform:translateY(0) scale(0.6); opacity:0; }
    12%{ opacity:0.9; }
    85%{ opacity:0.7; }
    100%{ transform:translateY(-105vh) scale(1); opacity:0; }
  }
  @keyframes driftX{ 0%,100%{margin-left:-12px;} 50%{margin-left:12px;} }

  /* two chicks: idle, then walk in, meet, kiss, and settle by their new house */
  #chick1Wrap, #chick2Wrap{
    position:absolute; bottom:9%; left:50%; z-index:9;
    transition: transform 3.6s cubic-bezier(.25,.1,.2,1);
  }
  #chick1Wrap{ transform: translateX(-190px) rotate(0deg); }
  #chick2Wrap{ transform: translateX(190px) scaleX(-1) rotate(0deg); }

  #chick1Wrap.meet{ transform: translateX(-42px) rotate(0deg); }
  #chick2Wrap.meet{ transform: translateX(42px) scaleX(-1) rotate(0deg); }

  #chick1Wrap.kiss{ transform: translateX(-22px) rotate(8deg); transition-duration: 1s; }
  #chick2Wrap.kiss{ transform: translateX(22px) scaleX(-1) rotate(-8deg); transition-duration: 1s; }

  #chick1Wrap.cuddle{ transform: translateX(-20px) rotate(0deg); transition-duration: 1.4s; }
  #chick2Wrap.cuddle{ transform: translateX(20px) scaleX(-1) rotate(0deg); transition-duration: 1.4s; }

  #chick1Wrap.settle{ transform: translateX(-64px) rotate(0deg); transition-duration: 2.2s; }
  #chick2Wrap.settle{ transform: translateX(64px) scaleX(-1) rotate(0deg); transition-duration: 2.2s; }

  #chick1, #chick2{
    font-size: clamp(50px,12vw,86px);
    display:inline-block;
    animation: bob 0.6s ease-in-out infinite;
    filter: drop-shadow(0 6px 5px rgba(107,58,43,0.35));
  }
  @keyframes bob{ 0%,100%{transform:translateY(0) rotate(-3deg);} 50%{transform:translateY(-9px) rotate(3deg);} }
  #chickFlower{
    position:absolute; bottom: 6px; left: 78%;
    font-size: clamp(18px,4.6vw,30px);
    animation: bob 0.6s ease-in-out infinite;
  }

  /* little blush hearts before the kiss */
  .blush{
    position:absolute; top:-16px; left:50%; font-size:14px; opacity:0;
    transition: opacity 0.7s ease, transform 0.7s ease;
    transform: translateX(-50%) translateY(6px) scale(0.7);
  }
  #chick1Wrap.blush-on .blush, #chick2Wrap.blush-on .blush{
    opacity:1; transform: translateX(-50%) translateY(0) scale(1);
    animation: blushFloat 1.6s ease-in-out infinite;
  }
  @keyframes blushFloat{ 0%,100%{ transform: translateX(-50%) translateY(0) scale(1);} 50%{ transform: translateX(-50%) translateY(-5px) scale(1.08);} }

  /* thought bubble: let's build a home */
  #thought{
    position:absolute; bottom: 24%; left:50%; transform: translateX(-50%) translateY(6px) scale(0.85);
    font-size: clamp(18px,4.4vw,26px);
    opacity:0; z-index:12;
    background: rgba(255,248,236,0.9);
    border-radius: 16px;
    padding: 6px 14px;
    box-shadow: 0 6px 16px rgba(107,58,43,0.18);
    transition: opacity 0.8s ease, transform 0.8s ease;
  }
  #thought.show{ opacity:1; transform: translateX(-50%) translateY(0) scale(1); }

  /* the kiss moment */
  #kissHeart{
    position:absolute; bottom: 22%; left:50%;
    transform: translateX(-50%) scale(0);
    font-size: clamp(20px,5vw,34px);
    z-index:11; opacity:0;
    transition: opacity 0.7s ease, transform 0.7s cubic-bezier(.25,.3,.3,1);
  }
  #kissHeart.pop{ opacity:1; transform: translateX(-50%) translateY(-8px) scale(1.1); }

  /* little bursting hearts around the kiss */
  .burstHeart{
    position:absolute; z-index:11; font-size:14px; opacity:0;
    animation: burstUp 1.6s ease-out forwards;
  }
  @keyframes burstUp{
    0%{ opacity:0; transform: translate(0,0) scale(0.5); }
    18%{ opacity:1; }
    100%{ opacity:0; transform: translate(var(--bx), var(--by)) scale(1.1); }
  }

  /* the little house they build together */
  #house{
    position:absolute; bottom: 9.5%; left:50%;
    transform: translate(-50%, 14px) scale(0.9);
    opacity:0;
    z-index:6;
    transition: opacity 1s ease, transform 1s cubic-bezier(.25,.2,.25,1);
  }
  #house.show{ opacity:1; transform: translate(-50%,0) scale(1); }
  #houseBody{
    position:relative;
    width: clamp(64px,16vw,96px);
    height: clamp(46px,11vw,68px);
    background: linear-gradient(180deg, #FFDE8A, #F6C453);
    border-radius: 3px;
    box-shadow: inset 0 -6px 0 rgba(107,58,43,0.12);
  }
  #houseRoof{
    position:absolute; top:0; left:50%;
    width:0; height:0;
    transform: translate(-50%,-96%);
    border-left: clamp(38px,9.5vw,58px) solid transparent;
    border-right: clamp(38px,9.5vw,58px) solid transparent;
    border-bottom: clamp(30px,7.5vw,46px) solid #B5453A;
    opacity:0;
    transition: transform 0.9s cubic-bezier(.25,.3,.25,1), opacity 0.5s ease;
  }
  #house.roof-on #houseRoof{ transform: translate(-50%,-88%); opacity:1; }
  #houseDoor{
    position:absolute; bottom:0; left:50%;
    width: 26%; height:55%;
    transform: translateX(-50%);
    background: #7A4B2E;
    border-radius: 3px 3px 0 0;
    opacity:0;
    transition: opacity 0.7s ease;
  }
  #house.door-on #houseDoor{ opacity:1; }
  #houseWindow{
    position:absolute; top:16%; left:14%;
    width: 20%; height:22%;
    background: #FFF7DA;
    border-radius: 2px;
    opacity:0;
    transition: opacity 0.7s ease;
  }
  #house.window-on #houseWindow{ opacity:1; }
  #chimneySmoke{
    position:absolute; top:-40%; right:12%;
    font-size: clamp(12px,3vw,18px);
    opacity:0;
  }
  #house.smoke-on #chimneySmoke{
    opacity:1;
    animation: smokeRise 3.2s ease-in-out infinite;
  }
  @keyframes smokeRise{
    0%{ transform:translateY(0) scale(0.8); opacity:0.5; }
    50%{ transform:translateY(-14px) scale(1); opacity:0.9; }
    100%{ transform:translateY(-28px) scale(1.1); opacity:0; }
  }

  /* little garden growing beside the house */
  .gardenFlower{
    position:absolute; bottom: 8%; font-size:18px; transform-origin:bottom center;
    opacity:0; transform: scale(0.3) rotate(-6deg);
    z-index:6;
    transition: opacity 0.7s ease, transform 0.7s cubic-bezier(.3,.2,.25,1);
  }
  .gardenFlower.grow{
    opacity:1; transform: scale(1) rotate(-6deg);
    animation: swayFlower 3.4s ease-in-out infinite;
    animation-delay: 0.7s;
  }

  /* tiny hammer while they build */
  #hammer{
    position:absolute; bottom: 20%; left:50%; transform: translateX(-50%);
    font-size: 20px; opacity:0; z-index:12;
  }
  #hammer.show{
    opacity:1;
    animation: hammering 0.5s ease-in-out infinite;
  }
  @keyframes hammering{ 0%,100%{ transform: translateX(-50%) rotate(-18deg);} 50%{ transform: translateX(-50%) rotate(18deg);} }

  /* final happy caption under the house */
  #endCaption{
    position:absolute; bottom: 3.5%; left:0; right:0; z-index:10;
    text-align:center; opacity:0;
    transition: opacity 0.8s ease;
    pointer-events:none;
  }
  #endCaption.show{ opacity:1; }
  #endCaption span{
    font-family:'Caveat', cursive; font-weight:700;
    font-size: clamp(20px,5vw,30px);
    color: var(--ink);
    text-shadow: 0 2px 6px rgba(255,255,255,0.5);
  }

  /* center card */
  #banner{
    position:absolute; top:24%; left:0; right:0; z-index:10;
    display:flex; justify-content:center; pointer-events:none; padding:0 20px;
    transition: opacity 0.9s ease;
  }
  #banner.hide{ opacity:0; }
  #banner .card{
    background: rgba(255,248,236,0.86);
    backdrop-filter: blur(3px);
    border-radius: 26px;
    padding: 22px 30px 20px;
    box-shadow: 0 12px 30px rgba(107,58,43,0.22);
    text-align:center;
    max-width: 520px;
  }
  #eyebrow{
    font-family:'Quicksand', sans-serif;
    font-weight:600;
    letter-spacing: 0.06em;
    font-size: clamp(11px,2.6vw,13px);
    color: var(--rose);
    margin-bottom: 4px;
  }
  #msgLine1{
    font-family:'Caveat', cursive;
    font-weight:700;
    font-size: clamp(34px,9vw,64px);
    color: var(--ink);
    line-height:1.05;
    min-height: 1.15em;
  }
  #msgLine2{
    font-family:'Cormorant Garamond', serif;
    font-style: italic;
    font-size: clamp(15px,3.8vw,19px);
    color: var(--ink);
    opacity:0.9;
    margin-top:6px;
    min-height: 1.4em;
  }
  .fadeText{ animation: textCycle 5.6s ease-in-out; }
  @keyframes textCycle{
    0%{opacity:0; transform:translateY(4px);}
    16%{opacity:1; transform:translateY(0);}
    84%{opacity:1; transform:translateY(0);}
    100%{opacity:0; transform:translateY(-4px);}
  }

  #soundBtn{
    position:absolute; top: calc(16px + env(safe-area-inset-top,0px)); right:16px; z-index:20;
    background: var(--card); border:none; border-radius:999px;
    padding: 9px 15px; font-family:'Quicksand', sans-serif; font-weight:600; font-size:13px;
    color: var(--ink); box-shadow: 0 4px 10px rgba(107,58,43,0.25); cursor:pointer;
  }
  #soundBtn:active{ transform: scale(0.96); }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>
<div id="stage">
  <button id="soundBtn" onclick="toggleSound()">🔈 Música</button>
  <div id="glow"></div>
  <div id="hillFar"></div>

  <div id="banner">
    <div class="card">
      <div id="eyebrow">21 de septiembre · Día de las Flores Amarillas</div>
      <div id="msgLine1"></div>
      <div id="msgLine2"></div>
    </div>
  </div>

  <div id="hillNear"></div>

  <div id="house">
    <div id="houseBody">
      <div id="houseRoof"></div>
      <div id="houseWindow"></div>
      <div id="houseDoor"></div>
      <div id="chimneySmoke">〰️</div>
    </div>
  </div>
  <div id="hammer">🔨</div>
  <div id="thought">💭 🏡</div>

  <div id="chick1Wrap">
    <div class="blush">💛</div>
    <div id="chick1">🐥</div>
    <div id="chickFlower">🌻</div>
  </div>
  <div id="chick2Wrap">
    <div class="blush">💛</div>
    <div id="chick2">🐤</div>
  </div>
  <div id="kissHeart">💕</div>

  <div id="endCaption"><span>Que siempre encontremos nuestro hogar en el amor 🏡💛</span></div>
</div>

<audio id="bgAudio" src="leberch-romantic-584475.mp3" autoplay loop preload="auto"></audio>

<script>
  const audio = document.getElementById('bgAudio');
  const soundBtn = document.getElementById('soundBtn');

  audio.addEventListener('play', () => {
    soundBtn.textContent = '🔊 Pausar';
  });
  audio.addEventListener('pause', () => {
    soundBtn.textContent = '🔈 Música';
  });

  function toggleSound(){
    if(audio.paused){
      audio.play().catch(() => {});
    } else {
      audio.pause();
    }
  }

  function startAudio(){
    audio.play().catch(() => {});
  }

  // Los moviles bloquean el autoplay con sonido hasta la primera interaccion.
  window.addEventListener('pointerdown', startAudio, { once: true, passive: true });
  window.addEventListener('keydown', startAudio, { once: true });
  startAudio();

  const stage = document.getElementById('stage');

  // sparkles scattered in the sky
  for(let i=0;i<22;i++){
    const s = document.createElement('div');
    s.className='spark';
    s.textContent='✦';
    s.style.left = (Math.random()*100)+'vw';
    s.style.top = (5+Math.random()*45)+'%';
    s.style.fontSize = (6+Math.random()*10)+'px';
    s.style.animationDuration = (2+Math.random()*3)+'s';
    s.style.animationDelay = '-'+(Math.random()*4)+'s';
    stage.appendChild(s);
  }

  // flowers on the hill
  const flowerEmoji = ['🌼','🌻'];
  for(let i=0;i<15;i++){
    const f = document.createElement('div');
    f.className='flower';
    f.textContent = flowerEmoji[Math.floor(Math.random()*flowerEmoji.length)];
    f.style.left = (2+Math.random()*96)+'vw';
    f.style.bottom = (2+Math.random()*9)+'%';
    f.style.fontSize = (18+Math.random()*16)+'px';
    f.style.animationDuration = (2.4+Math.random()*2)+'s';
    f.style.animationDelay = '-'+(Math.random()*3)+'s';
    stage.appendChild(f);
  }

  // drifting flowers & petals
  const petalEmoji = ['🌼','🌻','🌸'];
  for(let i=0;i<16;i++){
    const el = document.createElement('div');
    el.className='falling';
    el.textContent = petalEmoji[Math.floor(Math.random()*petalEmoji.length)];
    const fallDuration = 9+Math.random()*9;
    const swayDuration = 2+Math.random()*2;
    el.style.left = (Math.random()*100)+'vw';
    el.style.fontSize = (15+Math.random()*16)+'px';
    el.style.animationDuration = fallDuration+'s, '+swayDuration+'s';
    el.style.animationDelay = '-'+(Math.random()*fallDuration)+'s, -'+(Math.random()*swayDuration)+'s';
    stage.appendChild(el);
  }

  // floating hearts
  for(let i=0;i<9;i++){
    const h = document.createElement('div');
    h.className='heart';
    h.textContent='💛';
    const dur = 8+Math.random()*6;
    h.style.left = (Math.random()*100)+'vw';
    h.style.fontSize = (13+Math.random()*10)+'px';
    h.style.animationDuration = dur+'s, '+(2+Math.random()*2)+'s';
    h.style.animationDelay = '-'+(Math.random()*dur)+'s, 0s';
    stage.appendChild(h);
  }

  // romantic message cycle — runs through once, then the little love story begins
  const messages = [
    ['Te elijo cada día', 'porque mi corazón siempre encuentra su lugar contigo 💛'],
    ['Tatiana', 'amarte hace más bonito cada momento de mi vida'],
    ['Mi lugar favorito', 'es donde puedo compartir contigo mis días y mis sueños'],
    ['Gracias por existir', 'tu forma de quererme ilumina todo lo que vivimos'],
    ['Pollito y pollito', 'un apodo pequeño para un amor enorme entre los dos'],
    ['Te amo', 'hoy, mañana y en cada historia que nos quede por vivir 🌻']
  ];
  let idx = 0;
  const line1 = document.getElementById('msgLine1');
  const line2 = document.getElementById('msgLine2');
  const banner = document.getElementById('banner');

  function showMessage(){
    line1.classList.remove('fadeText'); line2.classList.remove('fadeText');
    void line1.offsetWidth;
    line1.textContent = messages[idx][0];
    line2.textContent = messages[idx][1];
    line1.classList.add('fadeText'); line2.classList.add('fadeText');
    idx++;
    if(idx < messages.length){
      setTimeout(showMessage, 4400);
    } else {
      setTimeout(()=>{
        banner.classList.add('hide');
        setTimeout(startLoveStory, 900);
      }, 4400);
    }
  }
  showMessage();

  // little bursting hearts around a point on screen
  function burstHearts(xPct, yPct, count){
    for(let i=0;i<count;i++){
      const h = document.createElement('div');
      h.className = 'burstHeart';
      h.textContent = ['💛','💕','✨'][Math.floor(Math.random()*3)];
      const angle = (Math.PI*2*i)/count + Math.random()*0.5;
      const dist = 40 + Math.random()*30;
      h.style.setProperty('--bx', Math.cos(angle)*dist + 'px');
      h.style.setProperty('--by', (Math.sin(angle)*dist - 30) + 'px');
      h.style.left = xPct + 'vw';
      h.style.bottom = yPct + '%';
      h.style.fontSize = (12+Math.random()*8) + 'px';
      h.style.animationDelay = (Math.random()*0.3) + 's';
      stage.appendChild(h);
      setTimeout(()=> h.remove(), 2200);
    }
  }

  // grow a little garden flower beside the house
  function growFlower(leftVw, delayMs){
    const f = document.createElement('div');
    f.className = 'gardenFlower';
    f.textContent = Math.random() > 0.5 ? '🌼' : '🌻';
    f.style.left = leftVw + 'vw';
    f.style.fontSize = (16 + Math.random()*10) + 'px';
    stage.appendChild(f);
    setTimeout(()=> f.classList.add('grow'), delayMs);
  }

  // the story: meet → blush → kiss → cuddle → dream up a home → build it together → happy ending
  function startLoveStory(){
    const c1 = document.getElementById('chick1Wrap');
    const c2 = document.getElementById('chick2Wrap');
    const kissHeart = document.getElementById('kissHeart');
    const house = document.getElementById('house');
    const hammer = document.getElementById('hammer');
    const thought = document.getElementById('thought');
    const endCaption = document.getElementById('endCaption');

    // 1) they walk toward each other, slow and gentle
    setTimeout(()=>{
      c1.classList.add('meet');
      c2.classList.add('meet');
    }, 300);

    // 2) a little shy blush once they're close
    setTimeout(()=>{
      c1.classList.add('blush-on');
      c2.classList.add('blush-on');
    }, 4600);

    // 3) they lean in for a small kiss
    setTimeout(()=>{
      c1.classList.remove('blush-on');
      c2.classList.remove('blush-on');
      c1.classList.add('kiss');
      c2.classList.add('kiss');
      kissHeart.classList.add('pop');
      burstHearts(50, 24, 7);
    }, 7000);

    // 4) a gentle cuddle right after
    setTimeout(()=>{
      kissHeart.classList.remove('pop');
      c1.classList.remove('kiss'); c1.classList.add('cuddle');
      c2.classList.remove('kiss'); c2.classList.add('cuddle');
    }, 8600);

    // 5) an idea forms — let's build a home together
    setTimeout(()=> thought.classList.add('show'), 11500);
    setTimeout(()=>{
      thought.classList.remove('show');
      c1.classList.remove('meet'); c1.classList.remove('cuddle'); c1.classList.add('settle');
      c2.classList.remove('meet'); c2.classList.remove('cuddle'); c2.classList.add('settle');
    }, 14200);

    // 6) building their little house together, one piece at a time
    setTimeout(()=>{
      hammer.classList.add('show');
      house.classList.add('show');
    }, 16600);
    setTimeout(()=> house.classList.add('roof-on'), 18200);
    setTimeout(()=> { house.classList.add('window-on'); burstHearts(50, 20, 4); }, 19800);
    setTimeout(()=> house.classList.add('door-on'), 21400);

    // 7) a little garden blooms around their new home
    setTimeout(()=>{
      growFlower(38, 0);
      growFlower(41, 350);
      growFlower(59, 200);
      growFlower(62, 550);
    }, 22600);

    // 8) happy ending, together in front of their home
    setTimeout(()=>{
      hammer.classList.remove('show');
      house.classList.add('smoke-on');
      endCaption.classList.add('show');
      burstHearts(50, 22, 10);
    }, 24800);
  }
</script>
